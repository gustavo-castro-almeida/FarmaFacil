<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FarmaFácil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="box">
    <h2 id="mt" style="margin-top:0">Excluir medicamento?</h2>
    <p id="mp"></p>
    <div class="actions">
      <button class="danger" id="mok">Sim, excluir</button>
      <button class="ghost" id="mno">Não, manter</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="script.js"></script>
</body>
</html>
